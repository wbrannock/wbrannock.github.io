---
layout: default
---

<article class="page">
  {% if page.title %}
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.quote %}
    <blockquote class="page-header-quote">
      <p>"{{ page.quote }}"</p>
      {% if page.quote_attribution %}
      <footer>&mdash; {{ page.quote_attribution }}</footer>
      {% endif %}
    </blockquote>
    {% elsif page.description %}
    <p class="page-description">{{ page.description }}</p>
    {% endif %}
  </header>
  {% endif %}

  <div class="page-content">
    {{ content }}
  </div>
</article>
